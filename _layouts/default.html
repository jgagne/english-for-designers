<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <title>{{ page.title | escape }}</title>
  <meta name="description" content="{{ page.description | escape }}">

  <meta property="og:title" content="{{ page.title | escape }}">
  <meta property="og:description" content="{{ page.description | escape }}">
  <meta property="og:url" content="{{ page.url | absolute_url | escape }}">
  <meta property="og:type" content="website">

  {% if page.image %}
    <meta property="og:image" content="{{ page.image | absolute_url | escape }}">
    {% if page.image_alt %}
      <meta property="og:image:alt" content="{{ page.image_alt | escape }}">
    {% endif %}
  {% endif %}

  <!-- Primer CSS: styling from GitHub’s design system -->
  <link rel="stylesheet" href="https://unpkg.com/@primer/css@20.0.0/dist/primer.css">
</head>
<body class="markdown-body container-lg mx-auto my-5 p-3">
  {{ content }}
</body>
</html>
